{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Tracker</title>
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
    <div class="mobile-container" style="display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 400px; padding: 20px;">
        
        {% if messages %}
            {% for message in messages %}
                <div style="background: #dcfce7; color: #166534; padding: 14px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 600; border: 1px solid #10b981; text-align: center; animation: slideDown 0.3s ease-out;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="main-card" style="padding: 40px 30px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
            <h1 style="color: var(--primary); margin-bottom: 10px; font-weight: 800; letter-spacing: -1.5px; font-size: 32px;">Smart Tracker</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 16px;">Login to start your shift</p>
            
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required 
                       style="width: 100%; height: 50px; border-radius: 10px; border: 1px solid #cbd5e1; padding: 0 15px; margin-bottom: 15px; font-size: 15px;">
                
                <input type="password" name="password" placeholder="Password" required 
                       style="width: 100%; height: 50px; border-radius: 10px; border: 1px solid #cbd5e1; padding: 0 15px; margin-bottom: 20px; font-size: 15px;">
                
                <button type="submit" class="btn btn-primary" style="width: 100%; height: 52px; font-weight: 800; font-size: 16px; border-radius: 12px; cursor: pointer;">LOGIN</button>
                
                <p style="margin-top: 25px; font-size: 14px; color: #64748b; text-align: center;">
                    Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create one</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
