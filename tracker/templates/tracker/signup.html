{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Tracker</title>
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .auth-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        .auth-card h2 { color: #4f46e5; margin-bottom: 10px; font-weight: 800; }
        .auth-card p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        form p { text-align: left; margin-bottom: 15px; }
        form input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        form input:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .helptext { display: block; font-size: 11px; color: #94a3b8; margin-top: 5px; line-height: 1.4; }
        ul.errorlist { color: #ef4444; font-size: 12px; padding: 0; list-style: none; text-align: left; }
        .btn-auth { background: #4f46e5; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-auth:hover { background: #4338ca; transform: translateY(-1px); }
        .footer-link { margin-top: 25px; font-size: 14px; color: #64748b; }
        .footer-link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Smart Tracker</h2>
    <p>Get started by creating your account</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">CREATE ACCOUNT</button>
    </form>

    <div class="footer-link">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </div>
</div>

<style>
  
    ul.errorlist { 
        color: #ef4444;
        font-size: 11px; 
        padding: 0; 
        list-style: none; 
        text-align: left; 
        margin-top: -10px; 
        margin-bottom: 10px; 
    }
</style>

</body>
</html>
